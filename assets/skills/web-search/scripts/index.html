<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <script>
      function parseInput(input) {
        if (!input) return {};
        let raw = input;
        if (typeof input === 'object' && input !== null) {
          if ('data' in input) raw = input.data;
          else if (!('skillId' in input)) return input;
          else raw = input.data;
        }
        if (typeof raw === 'string') {
          const t = raw.trim();
          if (!t) return {};
          try { return JSON.parse(t); } catch { return { query: t }; }
        }
        return raw || {};
      }

      function cleanText(value) {
        return String(value || '')
          .replace(/\s+/g, ' ')
          .trim();
      }

      async function searchInstant(query) {
        const url = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(query) + '&format=json&no_redirect=1&no_html=1';
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error('search_api_' + res.status);
        }
        const data = await res.json();
        const hits = [];
        if (data.AbstractText) {
          hits.push({
            title: cleanText(data.Heading || 'Summary'),
            snippet: cleanText(data.AbstractText),
            url: cleanText(data.AbstractURL || ''),
          });
        }
        const topics = Array.isArray(data.RelatedTopics) ? data.RelatedTopics : [];
        for (const topic of topics) {
          if (hits.length >= 8) break;
          if (topic.Text) {
            hits.push({
              title: cleanText(topic.Text.split(' - ')[0] || topic.Text),
              snippet: cleanText(topic.Text),
              url: cleanText(topic.FirstURL || ''),
            });
            continue;
          }
          if (Array.isArray(topic.Topics)) {
            for (const sub of topic.Topics) {
              if (hits.length >= 8) break;
              if (!sub.Text) continue;
              hits.push({
                title: cleanText(sub.Text.split(' - ')[0] || sub.Text),
                snippet: cleanText(sub.Text),
                url: cleanText(sub.FirstURL || ''),
              });
            }
          }
        }
        return hits;
      }

      async function searchHtml(query, maxResults) {
        const body = 'q=' + encodeURIComponent(query);
        const res = await fetch('https://html.duckduckgo.com/html/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body,
        });
        if (!res.ok) {
          throw new Error('search_html_' + res.status);
        }
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const hits = [];
        doc.querySelectorAll('.result').forEach((node, index) => {
          if (index >= maxResults) return;
          const titleEl = node.querySelector('.result__a');
          const snippetEl = node.querySelector('.result__snippet');
          const title = cleanText(titleEl ? titleEl.textContent : '');
          const snippet = cleanText(snippetEl ? snippetEl.textContent : '');
          const url = titleEl && titleEl.getAttribute('href') ? cleanText(titleEl.getAttribute('href')) : '';
          if (!title && !snippet) return;
          hits.push({ title: title || snippet.slice(0, 80), snippet, url });
        });
        return hits;
      }

      function formatHits(query, hits) {
        const lines = hits.map((hit, index) => {
          const parts = [String(index + 1) + '. ' + hit.title];
          if (hit.snippet) parts.push(hit.snippet);
          if (hit.url) parts.push(hit.url);
          return parts.join('\n');
        });
        return {
          query,
          count: hits.length,
          results: hits,
          result: lines.join('\n\n'),
        };
      }

      window.runSkill = async function(input) {
        try {
          const jsonData = parseInput(input);
          const query = cleanText(jsonData.query || jsonData.q || jsonData.text || '');
          if (!query) {
            return { error: 'No search query provided.' };
          }
          const maxResults = Math.min(Math.max(Number(jsonData.maxResults) || 6, 1), 10);
          let hits = [];
          try {
            hits = await searchInstant(query);
          } catch (e) {
            console.log('search_instant_fail');
          }
          if (hits.length < 2) {
            try {
              const htmlHits = await searchHtml(query, maxResults);
              const seen = new Set(hits.map(hit => hit.title + hit.url));
              for (const hit of htmlHits) {
                const key = hit.title + hit.url;
                if (seen.has(key)) continue;
                seen.add(key);
                hits.push(hit);
              }
            } catch (e) {
              console.log('search_html_fail');
            }
          }
          if (hits.length === 0) {
            return { error: "No web results found for '" + query + "'." };
          }
          return formatHits(query, hits.slice(0, maxResults));
        } catch (e) {
          return { error: 'Web search failed: ' + (e && e.message ? e.message : String(e)) };
        }
      };
    </script>
  </body>
</html>
