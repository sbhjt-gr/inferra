buildscript {
  ext {
    getKotlinPluginVersion = {
      def fromRoot = null
      try {
        rootProject.buildscript.configurations.classpath.resolvedConfiguration
          .firstLevelModuleDependencies
          .each { dep ->
            if (dep.moduleGroup == "org.jetbrains.kotlin" && dep.moduleName == "kotlin-gradle-plugin") {
              fromRoot = dep.moduleVersion
            }
          }
      } catch (Throwable ignored) {
      }
      if (fromRoot) {
        return fromRoot
      }
      if (rootProject.hasProperty("kotlinVersion")) {
        return rootProject["kotlinVersion"].toString()
      }
      return "2.1.20"
    }

    getKspVersion = {
      def kotlinVersion = getKotlinPluginVersion()
      if (kotlinVersion.startsWith("2.3.")) {
        return kotlinVersion
      }
      if (rootProject.hasProperty("kspVersion")) {
        return rootProject["kspVersion"]
      }
      if (kotlinVersion.startsWith("2.1.20")) {
        return "2.1.20-2.0.1"
      }
      if (kotlinVersion.startsWith("2.0.21")) {
        return "2.0.21-1.0.28"
      }
      return "2.1.20-2.0.1"
    }

    // service artifact has no alpha10 on Google Maven yet
    AF_CLIENT = "1.0.0-alpha10"
    AF_SERVICE = "1.0.0-alpha09"
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:${getKspVersion()}"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

android {
  namespace "expo.modules.appfunctions"
  compileSdk 36

  defaultConfig {
    minSdk 28
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

ksp {
  arg("appfunctions:aggregateAppFunctions", "true")
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
  implementation "androidx.appfunctions:appfunctions:${AF_CLIENT}"
  implementation "androidx.appfunctions:appfunctions-service:${AF_SERVICE}"
  ksp "androidx.appfunctions:appfunctions-compiler:${AF_SERVICE}"
}
